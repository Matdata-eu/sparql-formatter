description:
  en:
    shortDescription: SPARQL 1.2 query and update formatter that keeps comments where you put them.
    longDescription: |
      A formatter for SPARQL 1.2 queries and updates. Unlike most formatters, it keeps every comment next to the code it belongs to.

      It supports the new SPARQL 1.2 syntax, such as VERSION, triple terms and reifiers. Formatting never changes the meaning of a query, and formatting twice gives the same result. It has no dependencies and ships as an ES and CommonJS module, a browser bundle, a command-line tool and a VS Code extension. It is a drop-in replacement for spfmt and the formatter behind MatGUI.
    documentation: https://matdata-eu.github.io/sparql-formatter/
    features:
    - SPARQL 1.2 queries and updates
    - Comments stay in place
    - Formatting never changes query meaning
    - Library, CLI, browser bundle and VS Code extension
    - No dependencies
