name: Publish to npm

# Publishes the package when a GitHub release is published. The version comes
# from the release tag (v1.2.3 -> 1.2.3); pre-release versions (1.2.3-beta.1)
# are published with the "next" dist-tag.
#
# Authentication uses npm trusted publishing (OIDC): no npm token is stored in
# the repository. See "Releasing" in README.md for the one-time npm setup.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Update package version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing version $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Test the built package
        run: npm run test:dist

      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then TAG=next; else TAG=latest; fi
          npm publish --access public --provenance --tag "$TAG"
