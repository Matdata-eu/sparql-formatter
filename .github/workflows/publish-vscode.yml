name: Publish VS Code extension

# Publishes the extension in vscode/ when a GitHub release is published, next to
# the npm package (publish.yml). The version comes from the release tag
# (v1.2.3 -> 1.2.3). The Marketplace only accepts major.minor.patch versions, so
# releases with a pre-release version (v1.3.0-beta.1) are not published here.
#
# Authentication (see "Releasing" in vscode/README.md):
# - Visual Studio Marketplace: the VSCE_PAT secret (Azure DevOps token)
# - Open VSX: trusted publishing (OIDC), no token stored in the repository

on:
  release:
    types: [published]

permissions:
  contents: write # upload the .vsix to the release
  id-token: write # Open VSX trusted publishing

jobs:
  publish:
    if: ${{ !contains(github.event.release.tag_name, '-') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false # never use caching in release builds

      - name: Install dependencies
        run: npm ci

      - name: Update extension version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG must look like v1.2.3"
            exit 1
          fi
          echo "Publishing version $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "VSIX=matdata-sparql-formatter-$VERSION.vsix" >> "$GITHUB_ENV"

      - name: Type check
        run: npm run typecheck

      - name: Package
        run: npx vsce package --out "$VSIX"

      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "$VSIX"

      - name: Publish to Open VSX
        run: npx ovsx publish "$VSIX" --trusted-publishing

      - name: Attach the extension to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "$VSIX" --clobber
